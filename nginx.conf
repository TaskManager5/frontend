server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === БЕЗОПАСНОСТЬ: базовые настройки ===
    # Скрываем версию Nginx в заголовке Server и на страницах ошибок
    server_tokens off;

    # Ограничиваем размер тела запроса (защита от DoS через большие payload)
    client_max_body_size 2m;

    # Таймауты для медленных клиентов (slowloris)
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # === БЕЗОПАСНОСТЬ: заголовки ответов ===
    # Запрет встраивания сайта в iframe (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Запрет MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Отключаем устаревший XSS-фильтр (современные браузеры его игнорируют)
    add_header X-XSS-Protection "0" always;
    # Политика referrer — не утекает полный URL на сторонние ресурсы
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Запрет на использование камеры, микрофона, геолокации
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === ЗАПРЕТ ДОСТУПА К СЛУЖЕБНЫМ ФАЙЛАМ ===
    # Скрытые файлы и папки (.git, .env, .htaccess и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Бэкапы, бэкап-файлы, временные файлы
    location ~* \.(bak|backup|old|orig|save|swp|swo|tmp|log|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # === ОСНОВНОЙ БЛОК: SPA ===
    location / {
        try_files $uri $uri/ /index.html;

        # Разрешаем только безопасные HTTP-методы для статики
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }
    }

    # === Socket.io (WebSocket) ===
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # === API-роуты бэкенда ===
    # auth, users, teams, tasks, analytics, skills, docs, healthz
    location ~ ^/(auth|users|teams|tasks|analytics|skills|docs|healthz) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты проксирования
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
